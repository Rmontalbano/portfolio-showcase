<style>
:root{color-scheme:dark}

body{margin:0;background:#171022;color:#f5f5f5;font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 16px;border-bottom:1px solid rgba(245,245,245,.14)}

.screen{position:relative;line-height:0}
.screen img{display:block;width:100%;height:auto;border-radius:8px;border:1px solid rgba(245,245,245,.14)}
.spot{position:absolute;padding:0;background:transparent;border:2px solid rgba(240,138,89,.9);border-radius:6px;cursor:pointer;animation:pulse 2.4s ease-in-out infinite}

@media (prefers-reduced-motion:reduce){.spot{animation:none}}
.note{max-width:1600px;margin:0 auto;padding:0 16px 20px;color:#bfc0c0;font-size:13px}
:focus-visible{outline:2px solid #8fb0e6;outline-offset:2px}
